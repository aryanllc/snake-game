<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101114;
    color: #fff;
    font-family: Arial, sans-serif;
  }
  .game {
    width: min(92vw, 520px);
    text-align: center;
  }
  h1 { margin: 0 0 10px; font-size: 34px; }
  .top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 18px;
  }
  canvas {
    width: 100%;
    aspect-ratio: 1;
    display: block;
    background: #17191e;
    border: 2px solid #30343c;
    border-radius: 14px;
    box-shadow: 0 12px 35px #0008;
  }
  button {
    margin-top: 16px;
    padding: 11px 20px;
    border: 0;
    border-radius: 10px;
    background: #35d06f;
    color: #07140c;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .help { margin-top: 12px; color: #aeb4bf; font-size: 14px; }
</style>
</head>
<body>
<div class="game">
  <h1>Snake</h1>
  <div class="top">
    <span>Score: <b id="score">0</b></span>
    <span>High Score: <b id="high">0</b></span>
  </div>
  <canvas id="canvas" width="500" height="500"></canvas>
  <button id="restart">Restart Game</button>
  <div class="help">Use Arrow Keys or WASD to move</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const highEl = document.getElementById("high");
const restart = document.getElementById("restart");

const grid = 25;
const cell = canvas.width / grid;
let snake, food, direction, nextDirection, score, gameOver, timer;
let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
highEl.textContent = highScore;

function reset() {
  snake = [
    {x: 12, y: 12},
    {x: 11, y: 12},
    {x: 10, y: 12}
  ];
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  score = 0;
  gameOver = false;
  scoreEl.textContent = score;
  placeFood();
  clearInterval(timer);
  timer = setInterval(update, 105);
  draw();
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * grid),
      y: Math.floor(Math.random() * grid)
    };
  } while (snake.some(part => part.x === food.x && part.y === food.y));
}

function update() {
  if (gameOver) return;

  direction = nextDirection;
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  if (
    head.x < 0 || head.x >= grid ||
    head.y < 0 || head.y >= grid ||
    snake.some(part => part.x === head.x && part.y === head.y)
  ) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("snakeHighScore", highScore);
      highEl.textContent = highScore;
    }
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = "#17191e";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle grid
  ctx.strokeStyle = "#20232a";
  ctx.lineWidth = 1;
  for (let i = 1; i < grid; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(canvas.width, i * cell);
    ctx.stroke();
  }

  // Food
  ctx.fillStyle = "#ff4d5a";
  ctx.beginPath();
  ctx.arc(
    food.x * cell + cell / 2,
    food.y * cell + cell / 2,
    cell * 0.34,
    0, Math.PI * 2
  );
  ctx.fill();

  // Snake
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? "#65f28e" : "#35d06f";
    const pad = 2;
    ctx.beginPath();
    ctx.roundRect(
      part.x * cell + pad,
      part.y * cell + pad,
      cell - pad * 2,
      cell - pad * 2,
      6
    );
    ctx.fill();
  });

  if (gameOver) {
    ctx.fillStyle = "#0009";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.font = "bold 42px Arial";
    ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = "20px Arial";
    ctx.fillText("Press Restart or Enter", canvas.width / 2, canvas.height / 2 + 30);
  }
}

function endGame() {
  gameOver = true;
  clearInterval(timer);
  draw();
}

function changeDirection(x, y) {
  if (direction.x === -x && direction.y === -y) return;
  nextDirection = {x, y};
}

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d","enter"].includes(key)) {
    e.preventDefault();
  }

  if (key === "arrowup" || key === "w") changeDirection(0, -1);
  if (key === "arrowdown" || key === "s") changeDirection(0, 1);
  if (key === "arrowleft" || key === "a") changeDirection(-1, 0);
  if (key === "arrowright" || key === "d") changeDirection(1, 0);
  if (key === "enter" && gameOver) reset();
});

restart.addEventListener("click", reset);

reset();
</script>
</body>
</html>
